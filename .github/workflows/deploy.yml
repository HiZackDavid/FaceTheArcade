name: Unity Build and Deploy to itch.io

on:
  push:
    branches:
      - Déploiement-sur-itch.io

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # For large files

      # Uses a cache so that the Library folder does not need to be regenerated everytime
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64
          restore-keys: |
            Library-

      # The build process for a Unity Build
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64

      # Stores the build, inside the build/StandaloneWindows64 folder, with the name build-Windows
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-Windows
          path: build/StandaloneWindows64

  deploy:
    name: Package and Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:

      # Get the build using the name build-Windows, that was stored in the last step of the last job. It's placed in a new path in the new VM
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: ./temp-build

      # Puts all the build files in a .zip called face-the-arcade-build.zip
      - name: Zip Build
        run: |
          cd temp-build
          zip -r ../face-the-arcade-build.zip .
          cd ..

      # Deploys to itch.io
      - name: Publish to itch.io
        uses: manleyjster/itch-publish@v1.4.3
        with:
          build_path: './face-the-arcade-build.zip'
          # Use the appropriate channel (windows, mac, linux)
          itch_target: 'jamc8/face-the-arcade:windows'
          itch_token: ${{ secrets.BUTLER_API_KEY }}
